externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/ConnectivityInsights

servers:
  - url: "{apiRoot}/connectivity-insights-subscriptions/vwip"
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`

tags:
  - name: Connectivity Insights Subscriptions
    description: |
      Create and manage a subscription to receive periodic connectivity
      insights

paths:
  /subscriptions:
    post:
      tags:
        - Connectivity Insights Subscriptions
      description: "Create a Connectivity insights subscription for a device"
      summary: "Create a Connectivity insights subscription for a device"
      operationId: createSubscription
      parameters:
        - $ref: "#/components/parameters/x-correlator"
      security:
        - openId:
            - connectivity-insights-subscriptions:org.camaraproject.connectivity-insights-subscriptions.v0.network-quality:create

      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionRequest"
        required: true
      callbacks:
        notifications:
          "{$request.body#/sink}":
            post:
              summary: "Subscription notification callback"
              description: |
                Important: this endpoint is to be implemented by the API
                consumer.The Connectivity Insights server will call this
                endpoint whenever a connectivity event occurs that changes
                the network's ability to meet the application's demands for
                a given device.
              operationId: postNotification
              parameters:
                - $ref: "#/components/parameters/x-correlator"
              requestBody:
                required: true
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: "#/components/schemas/NotificationEvent"

              responses:
                "204":
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: "#/components/headers/x-correlator"
                "400":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
                "401":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
                "403":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
                "410":
                  $ref: "../common/CAMARA_event_common.yaml#/components/responses/SinkGone410"
                "429":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/TooManyRequests429"
              security:
                - {}
                - notificationsBearerAuth: []
      responses:
        "201":
          description: Created
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "202":
          description: |
            Request accepted to be processed. It applies for async
            creation process.
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionAsync"
        "400":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/CreateSubscriptionBadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/SubscriptionPermissionDenied403"
        "409":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/CreateSubscriptionConflict409"
        "422":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/CreateSubscriptionDevice422"
        "429":
          $ref: "#/components/responses/ConnectivityInsightsSubscriptionsTooManyRequests429"

    get:
      tags:
        - Connectivity Insights Subscriptions
      summary: "Retrieve a list of apiName event subscription"
      operationId: getSubscriptionList
      description: |
        Operation to list subscriptions authorized to be retrieved by the
        provided access token.
      parameters:
        - $ref: "#/components/parameters/x-correlator"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/page"
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/perPage"
      security:
        - openId:
            - connectivity-insights-subscriptions:read
      responses:
        "200":
          description: List of event subscription details
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
            X-Total-Count:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-total-count"
            X-Total-Pages:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-total-pages"
            Link:
              $ref: "../common/CAMARA_common.yaml#/components/headers/link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionList"
        "400":
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequestWithRange400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"

  /subscriptions/{subscriptionId}:
    get:
      tags:
        - Connectivity Insights Subscriptions
      summary: "Operation to retrieve a subscription based on the provided ID"
      operationId: getSubscription
      description: Retrieve a given subscription by ID
      security:
        - openId:
            - connectivity-insights-subscriptions:read
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
        - $ref: "#/components/parameters/x-correlator"
      responses:
        "200":
          description: OK
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/SubscriptionIdRequired400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "404":
          $ref: "../common/CAMARA_common.yaml#/components/responses/NotFound404"

    delete:
      tags:
        - Connectivity Insights Subscriptions
      summary: "Operation to delete a subscription"
      operationId: deleteSubscription
      description: Delete a given subscription by ID
      security:
        - openId:
            - connectivity-insights-subscriptions:delete
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
        - $ref: "#/components/parameters/x-correlator"
      responses:
        "204":
          description: apiName subscription deleted
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
        "202":
          description: |
            Request accepted to be processed. It applies for async deletion
            process.
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionAsync"
        "400":
          $ref: "../common/CAMARA_event_common.yaml#/components/responses/SubscriptionIdRequired400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "404":
          $ref: "../common/CAMARA_common.yaml#/components/responses/NotFound404"

components:
  securitySchemes:
    openId:
      $ref: "../common/CAMARA_common.yaml#/components/securitySchemes/openId"
    notificationsBearerAuth:
      $ref: "../common/CAMARA_event_common.yaml#/components/securitySchemes/notificationsBearerAuth"
  parameters:
    SubscriptionId:
      name: subscriptionId
      in: path
      description: |
        Subscription identifier that was obtained from the create event
        subscription operation
      required: true
      schema:
        $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"
    x-correlator:
      $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
  headers:
    x-correlator:
      $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
  schemas:
    AdditionalKpis:
      description: additional information about connectivity quality
      type: object
      properties:
        signalStrength:
          description: |
            rough indication of the end user device radio signal conditions
          type: string
          enum:
            - excellent
            - good
            - fair
            - poor
            - no signal
        connectivityType:
          description: |
            the access technology connecting the user device to the operator
            network
          type: string
          enum:
            - 5G-SA
            - 5G-NSA
            - 4G
            - 3G

    Subscription:
      description: Represents a event-type subscription.
      type: object
      required:
        - sink
        - protocol
        - config
        - types
        - id
        - startsAt
      properties:
        id:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"
        protocol:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Protocol"
        sink:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Sink"
        types:
          description: |
            Camara Event types eligible to be delivered by this subscription.
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ApiEventType"
        config:
          $ref: "#/components/schemas/Config"
        startsAt:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        expiresAt:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        status:
          type: string
          description: |-
            Current status of the subscription - Management of Subscription
            State engine is not mandatory for now. Note not all statuses may
            be considered to be implemented. Details:
              - `ACTIVATION_REQUESTED`: Subscription creation (POST) is
              triggered but subscription creation process is not finished
              yet.
              - `ACTIVE`: Subscription creation process is completed.
              Subscription is fully operative.
              - `INACTIVE`: Subscription is temporarily inactive, but its
              workflow logic is not deleted.
              - `EXPIRED`: Subscription is ended (no longer active).
              This status applies when subscription is ended due to
              `SUBSCRIPTION_EXPIRED` or `ACCESS_TOKEN_EXPIRED` event.
              - `DELETED`: Subscription is ended as deleted (no longer
              active). This status applies when subscription information is
              kept (i.e. subscription workflow is no longer active but its
              metainformation is kept).
          enum:
            - ACTIVATION_REQUESTED
            - ACTIVE
            - EXPIRED
            - INACTIVE
            - DELETED
      discriminator:
        propertyName: protocol
        mapping:
          HTTP: "#/components/schemas/HTTPSubscriptionResponse"

    SubscriptionAsync:
      description: |
        Response for a event-type subscription request managed asynchronously
        (Creation or Deletion)
      type: object
      required:
        - id
      properties:
        id:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionId"

    PortsSpec:
      description: Specification of several TCP or UDP ports
      type: object
      minProperties: 1
      properties:
        ranges:
          description: Range of TCP or UDP ports
          type: array
          minItems: 1
          maxItems: 100
          items:
            description: A TCP or UDP port range defined by from and to ports
            type: object
            required:
              - from
              - to
            properties:
              from:
                $ref: "../common/CAMARA_common.yaml#/components/schemas/Port"
              to:
                $ref: "../common/CAMARA_common.yaml#/components/schemas/Port"
        ports:
          description: Array of TCP or UDP ports
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "../common/CAMARA_common.yaml#/components/schemas/Port"
      example:
        ranges:
          - from: 5010
            to: 5020
        ports:
          - 5060
          - 5070

    ApplicationServer:
      description: |
        A server hosting backend applications to deliver some business logic to
        clients.

        The developer can choose to provide the below specified device
        identifiers:

        * `ipv4Address`
        * `ipv6Address`

        The Operator will use this information to calculate the end to end
        network performance in scenarios where its feasible.
      type: object
      properties:
        ipv4Address:
          $ref: "#/components/schemas/ApplicationServerIpv4Address"
        ipv6Address:
          $ref: "#/components/schemas/ApplicationServerIpv6Address"
      minProperties: 1

    ApplicationServerIpv4Address:
      type: string
      maxLength: 18
      pattern: '^([01]?[0-9]?[0-9]|2[0-4][0-9]|25[0-5])(\.([01]?[0-9]?[0-9]|2[0-4][0-9]|25[0-5])){3}(\/(3[0-2]|[12]?[0-9]))?$'
      example: "192.168.0.1/24"
      description: |
        IPv4 address may be specified in form <address/mask> as:
          - address - an IPv4 number in dotted-quad form 1.2.3.4. Only this
          exact IP number will match the flow control rule.
          - address/mask - an IP number as above with a mask width of the
          form 1.2.3.4/24.
            In this case, all IP numbers from 1.2.3.0 to 1.2.3.255 will match.
            The bit width MUST be valid for the IP version.

    ApplicationServerIpv6Address:
      type: string
      maxLength: 49
      pattern: '^[0-9a-fA-F:.]+(\/(12[0-8]|1[0-1][0-9]|[1-9]?[0-9]))?$'
      example: "2001:db8:85a3:8d3:1319:8a2e:370:7344"
      description: |
        IPv6 address may be specified in form <address/mask> as:
          - address - The /128 subnet is optional for single addresses:
            - 2001:db8:85a3:8d3:1319:8a2e:370:7344
            - 2001:db8:85a3:8d3:1319:8a2e:370:7344/128
          - address/mask - an IP v6 number with a mask:
            - 2001:db8:85a3:8d3::0/64
            - 2001:db8:85a3:8d3::/64

    Config:
      description: |
        Implementation-specific configuration parameters needed by the
        subscription manager for acquiring events. Extends `ConfigBase` from
        `CAMARA_event_common.yaml` with the required, API-specific
        `subscriptionDetail` property and the optional `initialEvent` property.
        Note: if a request is performed for several event types, all subscribed
        events will use same `config` parameters.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/ConfigBase"
        - type: object
          required:
            - subscriptionDetail
          properties:
            subscriptionDetail:
              $ref: "#/components/schemas/CreateSubscriptionDetail"
            initialEvent:
              type: boolean
              description: |
                Set to `true` by API consumer if consumer wants to get an event as soon as the subscription is created and current situation reflects event request.
                If an event is triggered following `initialEvent` set to `true`, this event will be counted towards `subscriptionMaxEvents` (if provided).

    SinkCredential:
      $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SinkCredential"

    CreateSubscriptionDetail:
      description: The detail of the requested event subscription
      oneOf:
        - $ref: "#/components/schemas/NetworkQualitySubscriptionDetail"
        - $ref: "#/components/schemas/UserExperienceInsightsSubscriptionDetail"
      discriminator:
        propertyName: subscriptionType

    NetworkQualitySubscriptionDetail:
      description: Subscription detail for network-quality event type
      type: object
      properties:
        subscriptionType:
          description: Indicates the subscription type.
          type: string
          enum:
            - NETWORK_QUALITY
        device:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"
        applicationServer:
          $ref: "#/components/schemas/ApplicationServer"
        applicationServerPorts:
          description: |
            A list of single ports or port ranges on the application server
          allOf:
            - $ref: "#/components/schemas/PortsSpec"
        applicationProfileId:
          $ref: "#/components/schemas/ApplicationProfileId"
      required:
        - applicationServer
        - applicationProfileId
        - subscriptionType

    UserExperienceInsightsSubscriptionDetail:
      description: Subscription detail for user-experience event type
      type: object
      properties:
        subscriptionType:
          description: Indicates the subscription type.
          type: string
          enum:
            - USER_EXPERIENCE
        device:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"
        applicationType:
          $ref: "#/components/schemas/ApplicationType"
        datatype:
          $ref: "#/components/schemas/Datatype"
      required:
        - device
        - subscriptionType

    SubscriptionRequest:
      description: The request for creating a event-type event subscription
      type: object
      required:
        - sink
        - protocol
        - config
        - types
      properties:
        protocol:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Protocol"
        sink:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Sink"
        sinkCredential:
          $ref: "#/components/schemas/SinkCredential"
        types:
          description: |
            Camara Event types eligible to be delivered by this subscription.
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ApiEventType"
        config:
          $ref: "#/components/schemas/Config"
      discriminator:
        propertyName: protocol
        mapping:
          HTTP: "#/components/schemas/HTTPSubscriptionRequest"

    HTTPSubscriptionRequest:
      description: Subscription request for HTTP-based event delivery.
      allOf:
        - $ref: "#/components/schemas/SubscriptionRequest"
        - type: object
          properties:
            protocolSettings:
              $ref: "../common/CAMARA_event_common.yaml#/components/schemas/HTTPSettings"

    HTTPSubscriptionResponse:
      description: Subscription resource returned for HTTP-based event delivery.
      allOf:
        - $ref: "#/components/schemas/Subscription"
        - type: object
          properties:
            protocolSettings:
              $ref: "../common/CAMARA_event_common.yaml#/components/schemas/HTTPSettings"

    SubscriptionList:
      description: Response with subscriptions list
      type: object
      required:
        - subscriptions
        - pagination
      properties:
        subscriptions:
          description: Subscriptions list
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: "#/components/schemas/Subscription"
        pagination:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Pagination"

    NetworkQualityInsight:
      type: object
      description: |
        the network's confidence level at being able to meet the network
        demands of a given application for a given terminal device.
      properties:
        applicationProfileId:
          $ref: "#/components/schemas/ApplicationProfileId"
        packetDelayBudget:
          $ref: "#/components/schemas/NetworkQualityThresholdsConfidence"
        targetMinDownstreamRate:
          $ref: "#/components/schemas/NetworkQualityThresholdsConfidence"
        targetMinUpstreamRate:
          $ref: "#/components/schemas/NetworkQualityThresholdsConfidence"
        packetlossErrorRate:
          $ref: "#/components/schemas/NetworkQualityThresholdsConfidence"
        jitter:
          $ref: "#/components/schemas/NetworkQualityThresholdsConfidence"
        additionalKpis:
          $ref: "#/components/schemas/AdditionalKpis"

    NetworkQualityThresholdsConfidence:
      type: string
      description: |
        a plain-language indicator of how confident the network is to meet a
        given network demand.
      enum:
        - meets the application requirements
        - unable to meet the application requirements

    ApplicationProfileId:
      description: Identifier for the Application Profile
      type: string
      format: uuid
      maxLength: 36

    ApiNotificationEvent:
      description: |
        API-specific notification event group.
        Extends the CloudEvent envelope and constrains `type` to the set of
        event types defined by this API project.
        Adding a new event type only requires updating ApiEventType and the
        discriminator mapping below — the CloudEvent base never changes.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/CloudEvent"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/ApiEventType"
      discriminator:
        propertyName: "type"
        mapping:
          org.camaraproject.connectivity-insights-subscriptions.v0.network-quality: "#/components/schemas/EventNetworkQuality"
          org.camaraproject.connectivity-insights-subscriptions.v0.user-experience: "#/components/schemas/EventUserExperience"

    SubscriptionLifecycleEvent:
      description: |
        Subscription lifecycle event group, common to all CAMARA APIs that
        support explicit subscriptions.
        Extends the CloudEvent envelope and constrains `type` to the set of
        lifecycle event types managed by Commonalities.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/CloudEvent"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/SubscriptionLifecycleEventType"
      discriminator:
        propertyName: type
        mapping:
          org.camaraproject.connectivity-insights-subscriptions.v0.subscription-started: "#/components/schemas/EventSubscriptionStarted"
          org.camaraproject.connectivity-insights-subscriptions.v0.subscription-updated: "#/components/schemas/EventSubscriptionUpdated"
          org.camaraproject.connectivity-insights-subscriptions.v0.subscription-ended: "#/components/schemas/EventSubscriptionEnded"

    NotificationEvent:
      description: |
        Union of all valid notification event groups at the callback endpoint.
        Its only responsibility is to enumerate which groups are valid payloads
        for this API's notification callback.
      oneOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"

    EventNetworkQuality:
      description: event structure for Network Quality
      allOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/NetworkQualityInsight"

    EventUserExperience:
      description: event structure for User Experience Insights
      allOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/UserExperienceInsights"

    UserExperienceInsights:
      type: object
      description: |
        User Experience Collection and Recording
      properties:
        appSignalingAndStatisticsAnalysisRecords:
          description: List of application signaling and statistics analysis records.
          type: array
          items:
            $ref: "#/components/schemas/AppSignalingAndStatisticsAnalysisRecord"
          minItems: 1
          maxItems: 100

    AppSignalingAndStatisticsAnalysisRecord:
      type: object
      description: |
        Application signaling and statistics analysis record for user experience insights.
      properties:
        startTime:
          description: Start time of data collection record analysis.
          allOf:
            - $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        endTime:
          description: End time of data collection record analysis.
          allOf:
            - $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        applicationType:
          description: Analysis application category type.
          allOf:
            - $ref: "#/components/schemas/ApplicationType"
        applicationId:
          description: Collected application ID.
          allOf:
            - $ref: "#/components/schemas/ApplicationId"
        areaData:
          description: Collection area.
          allOf:
            - $ref: "#/components/schemas/AreaData"
        appSignalingData:
          description: Cellular network information within the data period.
          allOf:
            - $ref: "#/components/schemas/AppSignalingData"
        applicationIndicatorStatistics:
          description: Basic application statistics.
          allOf:
            - $ref: "#/components/schemas/ApplicationIndicatorStatistics"
        applicationExperienceAnalysis:
          description: Application experience statistics data.
          allOf:
            - $ref: "#/components/schemas/ApplicationExperienceAnalysis"

    ApplicationIndicatorStatistics:
      type: object
      description: |
        Basic statistics on the application during the application use period.
      properties:
        subAppStartTime:
          description: Application start time.
          allOf:
            - $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        subAppEffDur:
          type: integer
          format: int32
          minimum: 0
          maximum: 86400
          description: |
            Unsigned integer identifying a period of time in units of seconds
        avgBwUl:
          description: Average uplink bandwidth of an application.
          allOf:
            - $ref: "#/components/schemas/BitRate"
        avgBwDl:
          description: Average downlink bandwidth of an application.
          allOf:
            - $ref: "#/components/schemas/BitRate"
        maxBwUl:
          description: Maximum uplink bandwidth of the application
          allOf:
            - $ref: "#/components/schemas/BitRate"
        maxBwDl:
          description: Maximum downlink bandwidth of the application
          allOf:
            - $ref: "#/components/schemas/BitRate"
        subAppVol:
          description: Application-level traffic statistics
          allOf:
            - $ref: "#/components/schemas/VolumeMeasurement"
        maxDelayAn:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: |
            Maximum wireless-side latency of an application.
        maxDelayDn:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: |
            Maximum wired-side latency of an application.

    ApplicationExperienceAnalysis:
      type: object
      description: |
        Application experience statistics data.
      properties:
        avgQoe:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: |
            Average score of experience analysis. Value range: 0 to 100 points.
        maxResolution:
          type: string
          maxLength: 64
          pattern: '^[0-9]{3,4}$'
          description: |
            Maximum resolution in the experience analysis period, expressed in
            vertical pixels (e.g. 720, 1080, 2160).
        majorityResolution:
          type: string
          maxLength: 64
          pattern: '^[0-9]{3,4}$'
          description: |
            The resolution with the highest duration ratio within the experience
            analysis period, expressed in vertical pixels (e.g. 720, 1080, 2160).
        maxBitRateUl:
          description: Maximum uplink bit rate (kbit/s).
          allOf:
            - $ref: "#/components/schemas/BitRate"
        avgBitRateUl:
          description: Average uplink bit rate (kbit/s)
          allOf:
            - $ref: "#/components/schemas/BitRate"
        maxBitRateDl:
          description: Maximum downlink bit rate (kbit/s)
          allOf:
            - $ref: "#/components/schemas/BitRate"
        avgBitRateDl:
          description: Average downlink bit rate (kbit/s)
          allOf:
            - $ref: "#/components/schemas/BitRate"
        stallSec:
          type: integer
          format: int32
          minimum: 0
          maximum: 86400
          description: Frame freezing duration, in seconds.
        stallNum:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Number of frame freezing times. The detection period is 5 seconds.
        serviceDelay:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: Service latency, in seconds.
        initialDur:
          type: integer
          format: int32
          minimum: 0
          maximum: 86400
          description: |
            Initial service buffering duration, in seconds.

    AreaData:
      type: object
      description: |
        Information about the area where a user is located.
      properties:
        region:
          type: string
          maxLength: 128
          description: User's region of residence.
        district:
          type: string
          maxLength: 256
          description: Areas or streets within a region.

    AppSignalingData:
      type: object
      description: |
        Application signaling data.
      properties:
        dnn:
          description: The DNN name.
          allOf:
            - $ref: "#/components/schemas/Dnn"
        qciOr5qi:
          description: The 5QI or QCI.
          allOf:
            - $ref: "#/components/schemas/QciOr5qi"
        netType:
          description: Cellular network access type (4G/5G).
          allOf:
            - $ref: "#/components/schemas/NetType"

    VolumeMeasurement:
      type: object
      description: |
        Application-level traffic statistics.
      properties:
        totalVolume:
          description: Total running traffic statistics.
          allOf:
            - $ref: "#/components/schemas/TrafficVolume"
        ulVolume:
          description: This shall indicate the volume (bytes) of user plane traffic for the uplink direction.
          allOf:
            - $ref: "#/components/schemas/TrafficVolume"
        dlVolume:
          description: This shall indicate the volume (bytes) of user plane traffic for the downlink direction.
          allOf:
            - $ref: "#/components/schemas/TrafficVolume"

    EventSubscriptionStarted:
      description: event structure for event subscription started
      allOf:
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"
        - type: object
          properties:
            data:
              $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionStarted"

    EventSubscriptionUpdated:
      description: event structure for event subscription updated
      allOf:
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"
        - type: object
          properties:
            data:
              $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionUpdated"

    EventSubscriptionEnded:
      description: event structure for event subscription ended
      allOf:
        - $ref: "#/components/schemas/SubscriptionLifecycleEvent"
        - type: object
          properties:
            data:
              $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SubscriptionEnded"

    ApiEventType:
      type: string
      description: Event type for network quality notifications.
      enum:
        - org.camaraproject.connectivity-insights-subscriptions.v0.network-quality
        - org.camaraproject.connectivity-insights-subscriptions.v0.user-experience

    SubscriptionLifecycleEventType:
      type: string
      description: |
        Enum of subscription lifecycle event type strings.
        These are managed by Commonalities and are identical across all CAMARA
        APIs that support explicit subscriptions.
      enum:
        - org.camaraproject.connectivity-insights-subscriptions.v0.subscription-started
        - org.camaraproject.connectivity-insights-subscriptions.v0.subscription-updated
        - org.camaraproject.connectivity-insights-subscriptions.v0.subscription-ended

    ApplicationType:
      description: |
        **NOTE**: applicationType is experimental and could change in a future release.

        The type of an application, representing a detailed classification of
        applications based on user usage habits and traffic characteristics. It is used
        to subscribe to applications of the same category. For example:
        live_video_publishing, meeting, mobile_gaming, short_video.
      type: string
      maxLength: 128
      enum:
        - ai_c                  # Conversational AI: interactive chat, voice assistants
        - ai_g                  # Generative AI: content generation, agentic workloads
        - file_transfer         # Bulk data upload/download, cloud storage sync, backups
        - instant_messaging     # Real-time text/voice messaging, async chat
        - live_video_publishing # Uplink live broadcast publishing (streamer/uplink)
        - live_video_viewing    # Downlink live stream viewing (audience/downlink)
        - meeting               # Multi-party A/V conferencing, screen sharing
        - mobile_gaming         # Low-latency multiplayer/cloud gaming (mobile)
        - fixed_gaming          # Fixed/console/PC online gaming
        - short_video           # Short-form video playback and feed consumption
        - video_on_demand       # On-demand HD video streaming (VOD)
        - voip                  # Two-party voice/video telephony
        - xr                    # Extended-reality (AR/VR/MR) services
      example: live_video_viewing

    ApplicationId:
      description: Indicates the Application Identifier.
      type: string
      format: uuid
      maxLength: 36

    BitRate:
      type: object
      description: |
        Specification of rate. The value is expressed in the unit indicated by
        the `unit` property.
      required:
        - value
        - unit
      properties:
        value:
          description: Quantity of rate
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          example: 125
        unit:
          $ref: "#/components/schemas/RateUnitEnum"
      example:
        value: 125
        unit: Mbps

    RateUnitEnum:
      description: Units of rate
      type: string
      enum:
        - bps
        - kbps
        - Mbps
        - Gbps
        - Tbps

    TrafficVolume:
      type: string
      maxLength: 64
      pattern: '^\d+(\.\d+)? (B|kB|MB|GB|TB)$'
      description: |
        String representing a traffic volume measured in bytes, formatted as a
        number followed by a unit: `B`, `kB`, `MB`, `GB` or `TB`.
      example: "125 MB"

    Dnn:
      type: string
      maxLength: 100
      pattern: '^[a-zA-Z0-9.-]+$'
      description: |
        String representing a Data Network Name as defined in clause 9A of 3GPP TS 23.003;
        it shall contain either a DNN Network Identifier, or a full DNN with both
        the Network Identifier and Operator Identifier, as specified in 3GPP TS 23.003
        clause 9.1.1 and 9.1.2. It shall be coded as string in which the labels are
        separated by dots (e.g. "Label1.Label2.Label3").

    QciOr5qi:
      type: integer
      format: int32
      minimum: 0
      maximum: 255
      description: |
        QoS Class Identifier or 5G QoS Identifier.

    NetType:
      type: string
      description: |
        The mobile technology of the network that the device is connected to.
      enum:
        - 2G
        - 3G
        - 4G
        - 5G
        - UNKNOWN

    Datatype:
      type: string
      description: |
        POOR_QOE_REPORT: Detects poor network experience and reports the collected statistical data.
        PERIODIC_REPORT: Periodically collecting and reporting data.
        ALL: Detects data collected and reported by the poor network experience reporting function. If no poor quality is detected, the data is reported periodically.
      enum:
        - POOR_QOE_REPORT
        - PERIODIC_REPORT
        - ALL

  responses:
    ConnectivityInsightsSubscriptionsTooManyRequests429:
      description: Too Many Requests
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 429
                  code:
                    enum:
                      - TOO_MANY_REQUESTS
                      - QUOTA_EXCEEDED
          examples:
            GENERIC_429_TOO_MANY_REQUESTS:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_429_TOO_MANY_REQUESTS"
            GENERIC_429_QUOTA_EXCEEDED:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_429_QUOTA_EXCEEDED"
