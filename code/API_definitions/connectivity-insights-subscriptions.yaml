openapi: 3.0.3
info:
  title: Connectivity Insights Subscriptions
  version: wip
  x-camara-commonalities: 0.9.0
  description: |
    With CAMARA Connectivity Insights, application developers gain essential
    visibility into network quality. This enables them to make informed
    decisions that enhance the end-user experience for their applications.

    # Introduction
      The Connectivity Insights API allows an application developer to ask
      the network the likelihood that an application's networking
      requirements can be met for a given end user session.

      This information helps a developer ensure their end users are able to
      get the best experience while using the application over their current
      network.

      Depending on the answer the network gives, the developer may decide to
      request a network boost (via the CAMARA QoD API) , and/or apply
      specific changes on the application side e.g. adjusting the
      resolution of the video stream upwards or downwards.


    # Relevant terms and definitions

      * **Device**: A device refers to any physical entity that can connect to a network and participate in network communication.

        At least one identifier for the device out of four options must be provided: IPv4 address, IPv6 address, Phone number, or Network Access Identifier assigned by the mobile network operator for the device. Where more than one device identifier is provided, only one identifier will be selected by the implementation and this choice indicated to the API consumer in the subscription creation response.

        Note: Network Access Identifier is defined for future use and will not be supported with this version of the API.

      * **Identifier for the application server**:
        IPv4 and/or IPv6 address of the application server
        (application backend)

      * **Notification URL and token**:
        Developers may provide a callback URL on which notifications can be
         received from the service provider. This is an optional parameter.

    # API functionality


      Following diagram shows the interaction between different components
      ![Sequence Diagram](https://raw.githubusercontent.com/camaraproject/ConnectivityInsights/r3.2/documentation/API_documentation/ConnectivityInsights-SequenceDiagram.png)

    ### User Experience Insights

      In addition to connectivity quality assessment, this API also
      supports User Experience Insights subscriptions. Developers can obtain
      detailed application-level experience analysis data including QoE scores,
      resolution, stalling, latency, and bandwidth statistics. This enables
      data-driven application strategy adjustments based on real-time network
      experience.

      This API provides the function of reporting poor-QoE data in real time or periodically reporting no poor-QoE data based on the datatype parameter.
      POOR_QOE_REPORT Detects poor network experience and reports the collected statistical data.
      PERIODIC_REPORT Periodically collecting and reporting data.
      ALL  Detects data collected and reported by the poor network experience reporting function. If no poor quality is detected, the data is reported periodically.

    ### Notification callback

    This endpoint describes the event notification received on subscription
    listener side when the event occurred. As for subscription, detailed
    description of the event notification is provided in the CAMARA API design
    guideline document.

    **WARNING**: This callback endpoint must be exposed on the listener side as
    `POST /{$request.body#/sink}` will be posted by the connectivity insights
    resource server to the webhook url provided by notification listener.

    ### Data Minimization

      #### device presence:
      These rules apply for subscription:

      - If a three-legged access token is used, the POST request and the POST
      and GET{id} responses must NOT provide the ``device`` object in
      ``config.subscriptionDetail``. For GET (list) only the subscription(s)
      for the device identified by the access token are retrieved (implicit
      filtering).
      - If a two-legged access token is used, the ``device`` object in
      ``config.subscriptionDetail`` is mandatory in the POST request and is
      returned in the POST and GET{id} responses.

      #### sinkCredential presence:

      ``sinkCredential`` is only present in POST request and not provided in
      POST or GET response.

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    <!-- CAMARA:MANDATORY:identifying-device-from-access-token:BEGIN -->

    # Identifying the device from the access token

    This API requires the API consumer to identify a device as the subject of the API as follows:
    - When the API is invoked using a two-legged access token, the subject will be identified from the optional `device` object, which therefore MUST be provided.
    - When a three-legged access token is used however, this optional identifier MUST NOT be provided, as the subject will be uniquely identified from the access token.

    This approach simplifies API usage for API consumers using a three-legged access token to invoke the API by relying on the information that is associated with the access token and was identified during the authentication process.

    ## Error handling:

    - If the subject cannot be identified from the access token and the optional `device` object is not included in the request, then the server will return an error with the `422 MISSING_IDENTIFIER` error code.

    - If the subject can be identified from the access token and the optional `device` object is also included in the request, then the server will return an error with the `422 UNNECESSARY_IDENTIFIER` error code. This will be the case even if the same device is identified by these two methods, as the server is unable to make this comparison.
    <!-- CAMARA:MANDATORY:identifying-device-from-access-token:END -->

    # Errors

    If the authentication token is not valid, a `401 UNAUTHENTICATED` error is
    returned.

    If the mobile subscription parameters contain a formatting error, a `400
    INVALID_ARGUMENT` error is returned.

    If the subscription identified by `subscriptionId` does not exist, a
    `404 NOT_FOUND` error is returned.

    Any more general service failures will result in an error in the `5xx` range
    with an explanation.

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified from the `x-camara-commonalities` field, the changelog and the metadata of the released API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->

    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->

