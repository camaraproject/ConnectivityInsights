    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/ConnectivityInsights

servers:
  - url: "{apiRoot}/connectivity-insights/vwip"
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`

tags:
  - name: Network Quality
    description: |
      Read the network's level of confidence that it can meet the quality
      thresholds for a given application profile and end user device.
  - name: User Experience Insights
    description: |
      Read detailed application experience analysis data including QoE scores,
      resolution, stalling, latency, and bandwidth statistics.

paths:
  /check-network-quality:
    post:
      security:
        - openId:
            - connectivity-insights:check
      tags:
        - Network Quality
      summary: Check the network quality.
      description: |
        Check the network quality. The response shows the network's current
         level of confidence that it can meet an application profile's quality
         thresholds for a given end user device.
      operationId: checkNetworkQuality
      parameters:
        - $ref: "#/components/parameters/x-correlator"
      requestBody:
        description: |
          An `ApplicationProfileId` and one or more device identifiers.
          Together these allow the network to calculate whether the thresholds
          defined in the application profile can be met for the particular
          connected device.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkQualityInsightRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/NetworkQualityInsightResponse"
                  - $ref: "#/components/schemas/DeviceResponseBody"
        "400":
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequestWithRange400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "404":
          $ref: "#/components/responses/ConnectivityInsightsNotFound404"
        "422":
          $ref: "../common/CAMARA_common.yaml#/components/responses/DeviceIdentifier422"
        "429":
          $ref: "#/components/responses/ConnectivityInsightsTooManyRequests429"

  /user-experience-insights:
    post:
      security:
        - openId:
            - connectivity-insights:user-experience-insights:check
      tags:
        - User Experience Insights
      summary: Check user experience insights.
      description: |
        Read user experience insights. The response provides detailed
        application-level experience analysis data including QoE scores,
        resolution, stalling, latency, and bandwidth statistics for a given
        device.
      operationId: checkUserExperienceInsights
      parameters:
        - $ref: "#/components/parameters/x-correlator"
      requestBody:
        description: |
          A `device` identifier and optional `applicationId` or `applicationType`.
          These allow the network to retrieve application experience analysis
          data for the particular connected device.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserExperienceInsightRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/UserExperienceInsightsResponse"
                  - $ref: "#/components/schemas/DeviceResponseBody"
        "400":
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
        "401":
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        "403":
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        "404":
          $ref: "#/components/responses/ConnectivityInsightsNotFound404"
        "422":
          $ref: "../common/CAMARA_common.yaml#/components/responses/DeviceIdentifier422"
        "429":
          $ref: "#/components/responses/ConnectivityInsightsTooManyRequests429"

components:
  securitySchemes:
    openId:
      $ref: "../common/CAMARA_common.yaml#/components/securitySchemes/openId"
  parameters:
    x-correlator:
      $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
  headers:
    x-correlator:
      $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
  schemas:
    NetworkQualityInsightRequest:
      description: |
        request body to query the network quality for a given device and
        application profile
      type: object
      required:
        - applicationProfileId
        - applicationServer
      properties:
        applicationProfileId:
          $ref: "#/components/schemas/ApplicationProfileId"
        device:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"
        applicationServer:
          $ref: "#/components/schemas/ApplicationServer"
        applicationServerPorts:
          description: |
            A list of single ports or port ranges on the application server
          allOf:
            - $ref: "#/components/schemas/PortsSpec"
        monitoringTimeStamp:
          type: string
          format: date-time
          maxLength: 64
          description: |
            this is an optional input parameter. A future data and time can be
            provided for predictive data. If no value is provided then the
            current date and time is used and network data for the monitoring
            data aggregation is used to check network performance against the
            application profile defined.
            It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
          example: "2023-07-03T12:27:08.312Z"

    NetworkQualityInsightResponse:
      type: object
      description: the network's confidence level at being able to meet the
        network demands of a given application for a given terminal device.
      properties:
        packetDelayBudget:
          $ref: "#/components/schemas/NetworkQualityThresholdsConfidence"
        targetMinDownstreamRate:
          $ref: "#/components/schemas/NetworkQualityThresholdsConfidence"
        targetMinUpstreamRate:
          $ref: "#/components/schemas/NetworkQualityThresholdsConfidence"
        packetlossErrorRate:
          $ref: "#/components/schemas/NetworkQualityThresholdsConfidence"
        jitter:
          $ref: "#/components/schemas/NetworkQualityThresholdsConfidence"
        additionalKPIs:
          $ref: "#/components/schemas/AdditionalKpis"

    AdditionalKpis:
      description: additional information about connectivity quality
      type: object
      properties:
        signalStrength:
          description: |
            rough indication of the end user device radio signal conditions
          type: string
          enum:
            - excellent
            - good
            - fair
            - poor
            - no signal
        connectivityType:
          description: |
            the access technology connecting the user device to the operator
            network
          type: string
          enum:
            - 5G-SA
            - 5G-NSA
            - 4G
            - 3G

    DeviceResponseBody:
      description: |
        The optional device identifier to include in the response
      type: object
      properties:
        device:
          description: |
            The device identifier that was used to fulfil the request.
            If this property is not present then the device
            identifier sent in the request was used.
          allOf:
            - $ref: "../common/CAMARA_common.yaml#/components/schemas/DeviceResponse"
          example: {"phoneNumber": "+123456789"}

    ApplicationServer:
      description: |
        A server hosting backend applications to deliver some business logic to
        clients.

        The developer can choose to provide the below specified device
        identifiers:

        * `ipv4Address`
        * `ipv6Address`

        The Operator will use this information to calculate the end to end
        network performance in scenarios where its feasible.
      type: object
      properties:
        ipv4Address:
          $ref: "#/components/schemas/ApplicationServerIpv4Address"
        ipv6Address:
          $ref: "#/components/schemas/ApplicationServerIpv6Address"
      minProperties: 1

    ApplicationServerIpv4Address:
      type: string
      maxLength: 18
      pattern: '^([01]?[0-9]?[0-9]|2[0-4][0-9]|25[0-5])(\.([01]?[0-9]?[0-9]|2[0-4][0-9]|25[0-5])){3}(\/(3[0-2]|[12]?[0-9]))?$'
      example: "192.168.0.1/24"
      description: |
        IPv4 address may be specified in form <address/mask> as:
          - address - an IPv4 number in dotted-quad form 1.2.3.4. Only this
          exact IP number will match the flow control rule.
          - address/mask - an IP number as above with a mask width of the
          form 1.2.3.4/24.
            In this case, all IP numbers from 1.2.3.0 to 1.2.3.255 will match.
            The bit width MUST be valid for the IP version.

    ApplicationServerIpv6Address:
      type: string
      maxLength: 49
      pattern: '^[0-9a-fA-F:.]+(\/(12[0-8]|1[0-1][0-9]|[1-9]?[0-9]))?$'
      example: "2001:db8:85a3:8d3:1319:8a2e:370:7344"
      description: |
        IPv6 address may be specified in form <address/mask> as:
          - address - The /128 subnet is optional for single addresses:
            - 2001:db8:85a3:8d3:1319:8a2e:370:7344
            - 2001:db8:85a3:8d3:1319:8a2e:370:7344/128
          - address/mask - an IP v6 number with a mask:
            - 2001:db8:85a3:8d3::0/64
            - 2001:db8:85a3:8d3::/64

    NetworkQualityThresholdsConfidence:
      type: string
      description: |
        a plain-language indicator of how confident the network is to meet a
        given network demand.
      enum:
        - meets the application requirements
        - unable to meet the application requirements

    ApplicationProfileId:
      description: Identifier for the Application Profile
      type: string
      format: uuid
      maxLength: 36

    PortsSpec:
      description: Specification of several TCP or UDP ports
      type: object
      minProperties: 1
      properties:
        ranges:
          description: Range of TCP or UDP ports
          type: array
          minItems: 1
          maxItems: 100
          items:
            description: A TCP or UDP port range defined by from and to ports
            type: object
            required:
              - from
              - to
            properties:
              from:
                $ref: "../common/CAMARA_common.yaml#/components/schemas/Port"
              to:
                $ref: "../common/CAMARA_common.yaml#/components/schemas/Port"
        ports:
          description: Array of TCP or UDP ports
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "../common/CAMARA_common.yaml#/components/schemas/Port"
      example:
        ranges:
          - from: 5010
            to: 5020
        ports:
          - 5060
          - 5070

    UserExperienceInsightRequest:
      description: Request body to query user experience insights for a given device
      type: object
      properties:
        device:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"
        applicationId:
          description: |
            Indicates the Application Identifier. If not carried, need to
            configure application types (short_video, meeting,
            live_video_publishing).
          allOf:
            - $ref: "#/components/schemas/ApplicationId"
        applicationType:
          description: |
            Indicates the Application type. If not carried, need to configure applicationId to assign apps.
          allOf:
            - $ref: "#/components/schemas/ApplicationType"
      required:
        - device

    UserExperienceInsightsResponse:
      type: object
      description: User experience insights result
      required:
        - userExperienceInsightsRecords
      properties:
        userExperienceInsightsRecords:
          description: List of user experience insights records.
          type: array
          items:
            $ref: "#/components/schemas/UserExperienceInsightsRecords"
          minItems: 1
          maxItems: 100

    ApplicationType:
      description: |
        **NOTE**: applicationType is experimental and could change in a future release.

        The type of an application, representing a detailed classification of
        applications based on user usage habits and traffic characteristics. It is used
        to subscribe to applications of the same category. For example:
        live_video_publishing, meeting, mobile_gaming, short_video.
      type: string
      maxLength: 128
      enum:
        - ai_c                  # Conversational AI: interactive chat, voice assistants
        - ai_g                  # Generative AI: content generation, agentic workloads
        - file_transfer         # Bulk data upload/download, cloud storage sync, backups
        - instant_messaging     # Real-time text/voice messaging, async chat
        - live_video_publishing # Uplink live broadcast publishing (streamer/uplink)
        - live_video_viewing    # Downlink live stream viewing (audience/downlink)
        - meeting               # Multi-party A/V conferencing, screen sharing
        - mobile_gaming         # Low-latency multiplayer/cloud gaming (mobile)
        - fixed_gaming          # Fixed/console/PC online gaming
        - short_video           # Short-form video playback and feed consumption
        - video_on_demand       # On-demand HD video streaming (VOD)
        - voip                  # Two-party voice/video telephony
        - xr                    # Extended-reality (AR/VR/MR) services
      example: live_video_viewing

    UserExperienceInsightsRecords:
      type: object
      description: Application Network Collection and Recording
      properties:
        appSignalingAndStatisticsAnalysisRecords:
          description: List of application signaling and statistics analysis records.
          type: array
          items:
            $ref: "#/components/schemas/AppSignalingAndStatisticsAnalysisRecord"
          minItems: 1
          maxItems: 100

    AppSignalingAndStatisticsAnalysisRecord:
      type: object
      description: |
        Application signaling and statistics analysis record for user experience insights.
      properties:
        startTime:
          description: Start time of data collection record analysis.
          allOf:
            - $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        endTime:
          description: End time of data collection record analysis.
          allOf:
            - $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        applicationType:
          description: Analysis application category type.
          allOf:
            - $ref: "#/components/schemas/ApplicationType"
        applicationId:
          description: Collected application ID.
          allOf:
            - $ref: "#/components/schemas/ApplicationId"
        appSignalingData:
          description: Cellular network information within the data period.
          allOf:
            - $ref: "#/components/schemas/AppSignalingData"
        applicationIndicatorStatistics:
          description: Basic application statistics.
          allOf:
            - $ref: "#/components/schemas/ApplicationIndicatorStatistics"
        applicationExperienceAnalysis:
          description: Application experience statistics data.
          allOf:
            - $ref: "#/components/schemas/ApplicationExperienceAnalysis"

    ApplicationIndicatorStatistics:
      type: object
      description: Basic statistics on the application during the application use period.
      properties:
        subAppStartTime:
          description: Application start time.
          allOf:
            - $ref: "../common/CAMARA_common.yaml#/components/schemas/DateTime"
        subAppEffDur:
          type: integer
          format: int32
          minimum: 0
          maximum: 86400
          description: Unsigned integer identifying a period of time in units of seconds
        avgBwUl:
          description: Average uplink bandwidth of an application.
          allOf:
            - $ref: "#/components/schemas/BitRate"
        avgBwDl:
          description: Average downlink bandwidth of an application.
          allOf:
            - $ref: "#/components/schemas/BitRate"
        maxBwUl:
          description: Maximum uplink bandwidth of the application
          allOf:
            - $ref: "#/components/schemas/BitRate"
        maxBwDl:
          description: Maximum downlink bandwidth of the application
          allOf:
            - $ref: "#/components/schemas/BitRate"
        subAppVol:
          description: Application-level traffic statistics
          allOf:
            - $ref: "#/components/schemas/VolumeMeasurement"
        maxDelayAn:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: Maximum wireless-side latency of an application.
        maxDelayDn:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: Maximum wired-side latency of an application.

    ApplicationExperienceAnalysis:
      type: object
      description: Application experience statistics data.
      properties:
        avgQoe:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: "Average score of experience analysis. Value range: 1 to 100 points."
        maxResolution:
          type: string
          maxLength: 64
          pattern: '^[0-9]{3,4}$'
          description: |
            Maximum resolution in the experience analysis period, expressed in
            vertical pixels (e.g. 720, 1080, 2160).
        majorityResolution:
          type: string
          maxLength: 64
          pattern: '^[0-9]{3,4}$'
          description: |
            The resolution with the highest duration ratio within the experience
            analysis period, expressed in vertical pixels (e.g. 720, 1080, 2160).
        maxBitRateUl:
          description: Maximum uplink bit rate (kbit/s).
          allOf:
            - $ref: "#/components/schemas/BitRate"
        avgBitRateUl:
          description: Average uplink bit rate (kbit/s)
          allOf:
            - $ref: "#/components/schemas/BitRate"
        maxBitRateDl:
          description: Maximum downlink bit rate (kbit/s)
          allOf:
            - $ref: "#/components/schemas/BitRate"
        avgBitRateDl:
          description: Average downlink bit rate (kbit/s)
          allOf:
            - $ref: "#/components/schemas/BitRate"
        stallSec:
          type: integer
          format: int32
          minimum: 0
          maximum: 86400
          description: Frame freezing duration, in seconds.
        stallNum:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Number of frame freezing times. The detection period is 5 seconds.
        serviceDelay:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: Service latency, in seconds.
        initialDur:
          type: integer
          format: int32
          minimum: 0
          maximum: 86400
          description: Initial service buffering duration, in seconds.

    AppSignalingData:
      type: object
      description: Application signaling data.
      properties:
        dnn:
          description: The DNN name.
          allOf:
            - $ref: "#/components/schemas/Dnn"
        qciOr5qi:
          description: The 5QI or QCI.
          allOf:
            - $ref: "#/components/schemas/QciOr5qi"
        netType:
          description: Cellular network access type (4G/5G).
          allOf:
            - $ref: "#/components/schemas/NetType"

    VolumeMeasurement:
      type: object
      description: Application-level traffic statistics.
      properties:
        totalVolume:
          description: Total running traffic statistics.
          allOf:
            - $ref: "#/components/schemas/TrafficVolume"
        ulVolume:
          description: This shall indicate the volume (bytes) of user plane traffic for the uplink direction.
          allOf:
            - $ref: "#/components/schemas/TrafficVolume"
        dlVolume:
          description: This shall indicate the volume (bytes) of user plane traffic for the downlink direction.
          allOf:
            - $ref: "#/components/schemas/TrafficVolume"

    BitRate:
      type: object
      description: |
        Specification of rate. The value is expressed in the unit indicated by
        the `unit` property.
      required:
        - value
        - unit
      properties:
        value:
          description: Quantity of rate
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          example: 125
        unit:
          $ref: "#/components/schemas/RateUnitEnum"
      example:
        value: 125
        unit: Mbps

    RateUnitEnum:
      description: Units of rate
      type: string
      enum:
        - bps
        - kbps
        - Mbps
        - Gbps
        - Tbps

    TrafficVolume:
      type: string
      maxLength: 64
      pattern: '^\d+(\.\d+)? (B|kB|MB|GB|TB)$'
      description: |
        String representing a traffic volume measured in bytes, formatted as a
        number followed by a unit: `B`, `kB`, `MB`, `GB` or `TB`.
      example: "125 MB"

    ApplicationId:
      description: Indicates the Application Identifier.
      type: string
      format: uuid
      maxLength: 36

    Dnn:
      type: string
      maxLength: 100
      pattern: '^[a-zA-Z0-9.-]+$'
      description: |
        String representing a Data Network Name as defined in clause 9A of 3GPP TS 23.003;
        it shall contain either a DNN Network Identifier, or a full DNN with both
        the Network Identifier and Operator Identifier, as specified in 3GPP TS 23.003
        clause 9.1.1 and 9.1.2. It shall be coded as string in which the labels are
        separated by dots (e.g. "Label1.Label2.Label3").

    QciOr5qi:
      type: integer
      format: int32
      minimum: 0
      maximum: 255
      description: QoS Class Identifier or 5G QoS Identifier.

    NetType:
      type: string
      description: |
